{% extends 'base.html' %}
{% block title %}Select Branch — {{ SYSTEM_NAME }}{% endblock %}

{% block auth_content %}
<div class="od-auth-wrap">
  <div class="od-auth-card">

    <div class="od-auth-brand">
      <i class="fa-solid fa-hospital-user fa-2x"></i>
      <h4>{{ SYSTEM_NAME }}</h4>
      <p class="text-muted small mt-1">Select your branch to continue</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="d-flex flex-column gap-2">
        {% for branch in branches %}
        <button type="submit" name="branch_id" value="{{ branch.id }}"
                class="btn od-branch-btn">
          <span class="od-branch-icon">
            {% if branch.branch_type == 'eye_clinic' %}
              <i class="fa-solid fa-eye"></i>
            {% else %}
              <i class="fa-solid fa-hospital"></i>
            {% endif %}
          </span>
          <span class="od-branch-info">
            <strong>{{ branch.name }}</strong>
            <small>{{ branch.get_branch_type_display }}</small>
          </span>
          <i class="fa-solid fa-chevron-right ms-auto"></i>
        </button>
        {% endfor %}
      </div>
    </form>

    <form method="post" action="{% url 'logout' %}" class="mt-3 text-center">
      {% csrf_token %}
      <button type="submit" class="od-text-btn">
        <i class="fa-solid fa-right-from-bracket"></i> Sign out
      </button>
    </form>

  </div>
</div>
{% endblock %}
